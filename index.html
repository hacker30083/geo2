:root {
--transparent: #0000;
--bgt: #0004;
--bgp: #000;
--bg: #181818;
--sub-bg: #242424;
--mgray: #666;
--fgray: #aaa;
--sub-fg: #ccc;
--fg: #fff;
--red2: #411;
--red4: #c55;
--red5: #f88;
--red6: #fcc;
--orange2: #320;
--orange5: #fc1;
--yellow2: #220;
--yellow5: #ff0;
--green2: #030;
--green3: #262;
--green4: #4a4;
--green5: #5f5;
--green6: #9f9;
--cyan5: #8cf;
--purple6: #abf;
--purple6trns: #abfa;
--accent1: hsl(225, 40%, 15%);
--accent2: hsl(220, 40%, 30%);
--accent3: hsl(213, 40%, 55%);
--accent4: hsl(205, 70%, 75%);
--accent5: hsl(196, 100%, 71%);
--accent6: hsl(194, 100%, 85%);
--qo: cubic-bezier(.25, 1, .5, 1);
--qs: cubic-bezier(0.4, 0.1, 0.5, 1);
--border-width: .09rem;
--border-style: solid;
font-family: Inter;
font-size: max(min(20px, 4vw), 1.6vw);
font-synthesis: weight style small-caps position;
}
*::placeholder {
color: var(--fg);
opacity: 40%;
}
body {
background: var(--bg);
color: var(--fg);
margin: 0;
padding: 0;
width: 100vw;
max-width: 100vw;
min-height: 100vh;
overflow: scroll;
}
hr {
align-self: center;
width: 99%;
border: var(--border-style) var(--border-width) var(--accent3);
margin: 1rem 0;
}
h1 { font-size: 1.75rem; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.375rem; }
h1, h2, h3, p {
margin: .5em 0;
}
button, .chk {
cursor: pointer;
user-select: none;
}
input[type=text], button, #ic {
background: var(--accent2);
border: none;
border-radius: 0;
color: var(--sub-fg);
font-family: inherit;
font-size: 1rem;
padding: .125rem .375rem;
outline: none;
text-wrap: nowrap;
flex: 1;
margin: .125rem;
}
.chk {
display: block;
position: relative;
padding-left: 2.75rem;
margin-bottom: .8rem;
font-size: 1rem;
}
.chk input {
position: absolute;
opacity: 0;
cursor: pointer;
width: 0;
height: 0;
}
.chk .cm {
position: absolute;
top: 0;
left: 0;
height: 1.2rem;
width: 2.2rem;
background: var(--accent3);
border-radius: .5rem;
}
.chk input:checked ~ .cm {
background: var(--green6);
}
.chk:focus-within input ~ .cm {
outline: var(--accent6) solid var(--border-width);
outline-offset: var(--border-width);
}
.chk:hover input:checked ~ .cm {
background: var(--accent3);
}
.chk:hover input ~ .cm {
background: var(--accent6);
outline: none;
}
.chk .cm:after {
content: "";
font-size: 1rem;
line-height: .84rem;
text-align: center;
width: .9rem;
height: .9rem;
border-radius: .4rem;
left: .16rem;
top: .15rem;
font-weight: bolder;
position: absolute;
background: var(--bgp);
}
.chk input:checked ~ .cm:after {
content: "+";
left: 1.14rem;
background: var(--accent1);
}
#ic {
overflow: clip;
display: flex;
flex: 1;
position: relative;
padding: 0;
--lspan: var(--accent4);
}
#ic input {
flex: 1;
min-width: 0;
width: 0;
margin: 0;
padding: .5rem;
border: none;
overflow: visible;
background: none;
color: inherit;
}
#ic span {
color: var(--lspan);
font-weight: bolder;
align-self: center;
padding: 0 .5rem 0 0;
}
.tm > *, #ic { border-radius: .375rem; }
.tm > *:first-child { border-radius: 1.2rem .375rem .375rem 1.2rem; }
.tm > *:last-child { border-radius: .375rem 1.2rem 1.2rem .375rem; }
button:focus {
outline: var(--accent5) var(--border-style) var(--border-width);
background: var(--accent1);
color: var(--fg);
}
#ic:focus-within {
outline: var(--accent5) var(--border-style) var(--border-width);
color: var(--fg);
}
#ic:is(.w) {
outline-color: var(--red5);
background: var(--red2);
color: var(--red6);
--lspan: var(--red4);
}
button:hover {
background: var(--accent6);
color: var(--bgp);
outline: none;
}
input::selection {
color: var(--bg);
background: var(--fg);
}
button:active {
background: var(--accent4);
scale: .98;
}
.tm {
position: fixed;
display: flex;
left: 50%;
translate: -50%;
width: 100%;
height: 2.5rem;
max-width: 40rem;
z-index: 1;
}
.sq {
aspect-ratio: 1.414;
flex: 0;
}
#m {
display: block;
background: var(--bgp);
margin: 0;
padding: 0;
}
#d {
position: absolute;
top: 2.5rem;
left: 0;
display: block;
margin: 0 auto;
padding: 0;
position: relative;
container-type: size;
z-index: 0;
overflow-y: clip;
}
#d:is(.w) { width: 100vw; }
#d:is(.h) { height: calc(100vh - 2.5rem); }
#d:is(.f) { max-height: calc(100vh - 2.5rem); max-width: 100vw; }
#c {
transition-duration: 250ms;
transition-timing-function: var(--qs);
font-size: 1.5cqw;
transform-origin: top left;
}
#c p {
font-size: 1em;
color: var(--fg);
position: absolute;
translate: -50% -50%;
background: var(--green2);
width: min-content;
text-align: center;
top: 50%;
left: 50%;
max-width: 7em;
padding: 0 .2em;
border: var(--green5) var(--border-style) .125em;
border-radius: .5em;
user-select: none;
}
#c p:is(.y) {
background: var(--yellow2);
border-color: var(--yellow5);
}
#c p:is(.o) {
background: var(--orange2);
border-color: var(--orange5);
}
#c p:is(.r) {
background: var(--red2);
border-color: var(--red5);
}
#m .f0 {
fill: var(--bg);
stroke: var(--purple6);
stroke-width: 3;
}
#m .w0 {
stroke: var(--cyan5);
stroke-width: 4;
fill: none;
}
#m .t0, #m .t1 {
fill: none;
stroke: var(--sub-fg);
stroke-linecap: round;
stroke-linejoin: round;
}
#m .t0 { stroke-width: 3; }
#m .t1 { stroke-width: 6; }
#m .h {
stroke: var(--purple6trns);
stroke-width: 20;
fill: none;
}
#m .z {
stroke-width: 8;
fill: var(--purple6trns);
}
#conf {
display: flex;
position: fixed;
top: 0;
width: 100vw;
height: 100vh;
background-color: var(--bgt);
backdrop-filter: contrast(.7) blur(1rem);
overflow: hidden;
justify-content: center;
align-items: center;
z-index: 99;
}
#conf div {
max-height: 100%;
overflow-y: scroll;
width: 100vw;
padding: 1rem max(50vw - 16rem, 1rem);
display: flex;
flex-direction: column;
}
#conf button:last-child {
background: none;
position: absolute;
right: 0;
top: 0;
width: 3rem;
height: 3rem;
margin: 0;
padding: 0;
font-size: 1.8rem;
line-height: 1rem;
}
#conf button:last-child:hover {
color: var(--fg);
}
</style>
